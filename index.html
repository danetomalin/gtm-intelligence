<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GTM Intelligence</title>
<style>
:root{--bg:#0a0a0a;--surface:#141414;--text:#e0e0e0;--muted:#888;--accent:#f97316;--border:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:48px;max-width:640px;text-align:center}
h1{font-size:2rem;font-weight:700;margin-bottom:12px}
h1 .accent{color:var(--accent)}
p{color:var(--muted);font-size:1rem;margin-bottom:16px}
.path{display:inline-block;font-family:Menlo,monospace;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:.85rem;color:var(--text);margin-top:8px}
.footer{margin-top:32px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div class="card">
<h1>GTM <span class="accent">Intelligence</span></h1>
<p>Live competitive intelligence reports auto-published from an n8n pipeline.</p>
<p>Individual brand reports are published at:</p>
<div class="path">gtm.danetomalin.com/{brand-slug}/</div>
<p class="footer">Powered by 9-agent GTM pipeline &middot; <a href="https://danetomalin.com" style="color:var(--accent)">danetomalin.com</a></p>
</div>
</body>
</html>
